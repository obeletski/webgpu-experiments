<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>navigator.digitclassifier MNIST Classifier</title>
  <style>
    /* Layout follows index.html: the canvas drives it, shrinking to fit a
       narrow or short viewport, and the panel is sized from it so the whole
       app fits on screen without scrolling. --chrome is the vertical space
       everything except the canvas needs. It is smaller here than on the other
       two pages because there is no backend switcher row - this page has only
       one backend, which is the entire point of it. */
    :root {
      --gap: clamp(6px, 1.6vh, 20px);
      --pad: clamp(10px, 1.8vh, 25px);
      --chrome: 290px;
      --canvas: clamp(140px, min(
                        calc(100vw - 20px - 2 * var(--pad)),
                        calc(100vh - var(--chrome))), 280px);
    }

    @supports (height: 100dvh) {
      /* dvh tracks the collapsing mobile browser toolbar; vh does not. */
      :root {
        --canvas: clamp(140px, min(
                          calc(100vw - 20px - 2 * var(--pad)),
                          calc(100dvh - var(--chrome))), 280px);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      box-sizing: border-box;
    }

    @supports (height: 100dvh) {
      body { min-height: 100dvh; }
    }

    h1 {
      margin: 0 0 4px;
      font-size: clamp(1rem, 4.4vw, 1.8rem);
      text-align: center;
    }

    p {
      color: #aaa;
      margin: 0 0 var(--gap);
      font-size: clamp(0.72rem, 2.9vw, 1rem);
      text-align: center;
      padding: 0 10px;
    }

    /* Height, not width, is the scarce axis on a short window - trim the
       vertical furniture rather than letting vw-based type overflow it. */
    @media (max-height: 700px) {
      h1 { font-size: clamp(0.9rem, 2.6vh, 1.3rem); }
      p { font-size: clamp(0.7rem, 2vh, 0.85rem); }
      #result { min-height: 4.2rem; }
      .api-info { min-height: 2.1rem; }
    }

    @media (max-height: 560px) {
      p.tagline { display: none; }
    }

    .app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #1e1e1e;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);

      /* Sized from the canvas plus its borders and the panel padding, so the
         panel never resizes when the result line grows or shrinks. */
      box-sizing: border-box;
      width: calc(var(--canvas) + 4px + 2 * var(--pad));
      gap: var(--gap);
      padding: var(--pad);
    }

    /* Visible interactive canvas */
    #paintCanvas {
      display: block;
      width: var(--canvas);
      height: var(--canvas);
      border: 2px solid #333;
      background: #000000;
      cursor: crosshair;
      border-radius: 6px;
      touch-action: none; /* Prevents scrolling while drawing on mobile */
    }

    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    button {
      flex: 1;
      padding: clamp(7px, 1.3vh, 12px);
      border: none;
      border-radius: 6px;
      font-size: clamp(0.8rem, 3.2vw, 1rem);
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    #clearBtn {
      background-color: #333;
      color: #fff;
    }

    #clearBtn:hover {
      background-color: #444;
    }

    #predictBtn {
      background-color: #007acc;
      color: #fff;
    }

    #predictBtn:hover {
      background-color: #0062a3;
    }

    button:disabled {
      opacity: 0.5;
      cursor: progress;
    }

    #result {
      margin-top: 0;
      font-size: clamp(0.95rem, 3.8vw, 1.4rem);
      font-weight: bold;
      text-align: center;

      /* Wrap long status lines instead of widening the panel, and hold enough
         height that the layout does not jump as the text changes length. */
      width: 100%;
      min-height: 5rem;
      overflow-wrap: anywhere;
    }

    .confidence {
      display: block;
      margin-top: 4px;
      font-size: clamp(0.72rem, 2.9vw, 0.95rem);
      color: #aaa;
      font-weight: normal;
      line-height: 1.4;
    }

    /* One measurement per line - they are read individually, not as prose. */
    .timing {
      display: block;
    }

    .alt a { color:#4aa3e0; font-size:0.85rem; }
    .alt { margin-top: var(--gap); }

    /* Costs that belong to acquiring the model rather than to any one
       classification, so they persist instead of being overwritten. */
    .api-info {
      width: 100%;
      margin-top: calc(var(--gap) * -0.55);
      text-align: center;
      font-size: clamp(0.7rem, 2.7vw, 0.85rem);
      line-height: 1.45;
      color: #888;
      min-height: 2.4rem;
    }

    /* Shown only when the API is missing. It has to explain three separate
       requirements, so it is prose rather than a one-line status. */
    .unsupported {
      display: none;
      width: 100%;
      box-sizing: border-box;
      background: #2a1f1f;
      border: 1px solid #5a3535;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: clamp(0.7rem, 2.7vw, 0.85rem);
      line-height: 1.5;
      color: #d7b9b9;
      text-align: left;
    }

    .unsupported.shown { display: block; }
    .unsupported strong { color: #f0d0d0; }
    .unsupported code {
      background: #1a1414;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 0.95em;
      overflow-wrap: anywhere;
    }
    .unsupported ul { margin: 6px 0 0; padding-left: 18px; }
    .unsupported li { margin-bottom: 3px; }
  </style>
</head>
<body>

  <h1>MNIST Classifier &mdash; navigator.digitclassifier</h1>
  <p class="tagline">Draw a single digit (0-9) clearly in the center of the box</p>

  <div class="app-container">
    <!-- Visible interactive canvas -->
    <canvas id="paintCanvas" width="280" height="280"></canvas>

    <!-- Hidden 28x28 workspace, where the tensor is actually built -->
    <canvas id="mnistCanvas" width="28" height="28" style="display: none;"></canvas>

    <div id="unsupported" class="unsupported"></div>

    <div id="apiInfo" class="api-info"></div>

    <div class="controls">
      <button id="clearBtn">Clear</button>
      <button id="predictBtn">Classify Digit</button>
    </div>

    <div id="result">Draw and click Classify...</div>
  </div>

  <p class="alt">
    <a href="./index.html">LiteRT.js version &rarr;</a> &nbsp;·&nbsp;
    <a href="./webgpu.html">Direct WebGPU version &rarr;</a>
  </p>

  <script type="module">
    /* =====================================================================
       PART 1 - DRAWING
       Deliberately free of imports and top-level awaits: a failure anywhere
       in the model code below must never be able to take the canvas down.
       Identical to index.html and webgpu.html, on purpose - the three pages
       are only comparable if what the user draws is handled the same way.
       ===================================================================== */

    const paintCanvas = document.getElementById('paintCanvas');
    const ctx = paintCanvas.getContext('2d', { willReadFrequently: true });
    const resultDiv = document.getElementById('result');

    ctx.strokeStyle = 'white';
    ctx.lineWidth = 18; // Thick enough so it stays legible when downscaled to 28x28
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    let isDrawing = false;

    // Map viewport coordinates onto the canvas bitmap. The scale factor matters
    // whenever CSS sizes the canvas differently from its width/height attributes
    // (responsive layouts, browser zoom, pinch zoom).
    function getCoordinates(e) {
      const rect = paintCanvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (paintCanvas.width / rect.width),
        y: (e.clientY - rect.top) * (paintCanvas.height / rect.height)
      };
    }

    function startDrawing(e) {
      isDrawing = true;
      // Capture keeps the stroke alive when the pointer wanders off the canvas.
      try { paintCanvas.setPointerCapture(e.pointerId); } catch { /* synthetic or stale pointer */ }
      const { x, y } = getCoordinates(e);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y); // A single tap should leave a dot, not nothing
      ctx.stroke();
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault(); // Stop screen bouncing on mobile
      const { x, y } = getCoordinates(e);
      ctx.lineTo(x, y);
      ctx.stroke();
    }

    function stopDrawing(e) {
      if (!isDrawing) return;
      isDrawing = false;
      try { paintCanvas.releasePointerCapture(e.pointerId); } catch { /* already released */ }
    }

    if (window.PointerEvent) {
      // Pointer events cover mouse, touch and stylus in one code path.
      paintCanvas.addEventListener('pointerdown', startDrawing);
      paintCanvas.addEventListener('pointermove', draw);
      paintCanvas.addEventListener('pointerup', stopDrawing);
      paintCanvas.addEventListener('pointercancel', stopDrawing);
    } else {
      paintCanvas.addEventListener('mousedown', startDrawing);
      paintCanvas.addEventListener('mousemove', draw);
      window.addEventListener('mouseup', stopDrawing);
      paintCanvas.addEventListener('touchstart', e => startDrawing(e.touches[0]));
      paintCanvas.addEventListener('touchmove', e => { e.preventDefault(); draw(e.touches[0]); });
      window.addEventListener('touchend', stopDrawing);
    }

    document.getElementById('clearBtn').addEventListener('click', () => {
      ctx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
      resultDiv.innerHTML = 'Canvas cleared.';
    });

    /* =====================================================================
       PART 2 - PREPROCESSING
       Byte-for-byte the same normalization the other two pages use. Kept
       inline rather than shared, matching how index.html and webgpu.html
       already each carry their own copy.
       ===================================================================== */

    // Downsample the 280x280 drawing to the 28x28 matrix MNIST expects,
    // normalizing it the way MNIST itself was built: each digit is size-fit into
    // a 20x20 box and then centred in the 28x28 frame by centre of mass - not by
    // bounding box, and not by a naive full-canvas downscale. A stroke sitting
    // off-centre, or filling the full canvas height - what a finger naturally
    // draws - is well outside that distribution without this step.
    function preprocessCanvas(channels) {
      const hiddenCanvas = document.getElementById('mnistCanvas');
      const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });

      // --- ink check, must run before any bounding-box work: an empty canvas
      // has no bounding box.
      //
      // Paint an opaque black background first. The strokes are anti-aliased, so
      // their edge pixels are partially transparent white; reading them straight
      // out of a transparent canvas yields RGB 255 with a low alpha, which would
      // turn every soft edge into a fully-lit pixel.
      hiddenCtx.globalCompositeOperation = 'source-over';
      hiddenCtx.fillStyle = 'black';
      hiddenCtx.fillRect(0, 0, 28, 28);
      hiddenCtx.drawImage(paintCanvas, 0, 0, paintCanvas.width, paintCanvas.height, 0, 0, 28, 28);

      const naiveData = hiddenCtx.getImageData(0, 0, 28, 28).data;
      let ink = 0;
      for (let i = 0; i < naiveData.length; i += 4) {
        ink += (0.299 * naiveData[i] + 0.587 * naiveData[i + 1] + 0.114 * naiveData[i + 2]) / 255.0;
      }

      const inputBuffer = new Float32Array(28 * 28 * channels);
      if (ink < 1) return { inputBuffer, ink };

      // --- 1. Bounding box of the ink on the full-resolution canvas.
      // Composited over black by hand (grayscale * alpha) rather than via a
      // second canvas - this pass only needs the box, not a resampled bitmap.
      // The box is inclusive of both edges, so even a single lit pixel yields a
      // 1x1 (not zero-area) box, which keeps the scale step below from ever
      // dividing by zero.
      const W = paintCanvas.width, H = paintCanvas.height;
      const raw = ctx.getImageData(0, 0, W, H).data;
      const BOX_THRESHOLD = 0.02; // ignore near-invisible anti-aliasing dust
      let minX = W, minY = H, maxX = -1, maxY = -1;
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = (y * W + x) * 4;
          const a = raw[i + 3] / 255;
          const gray = (0.299 * raw[i] + 0.587 * raw[i + 1] + 0.114 * raw[i + 2]) / 255;
          if (gray * a > BOX_THRESHOLD) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      // The ink >= 1 check above should make this unreachable; fall back to a
      // blank frame rather than let an empty box reach the division below.
      if (maxX < minX || maxY < minY) return { inputBuffer, ink: 0 };

      const boxW = maxX - minX + 1;
      const boxH = maxY - minY + 1;

      // --- 2. Scale that region so its longest side is 20px, preserving aspect.
      const scale = 20 / Math.max(boxW, boxH);
      const scaledW = Math.max(1, Math.round(boxW * scale));
      const scaledH = Math.max(1, Math.round(boxH * scale));

      const cropCanvas = document.createElement('canvas');
      cropCanvas.width = scaledW;
      cropCanvas.height = scaledH;
      const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
      // Same black-fill-before-drawImage reasoning as above.
      cropCtx.fillStyle = 'black';
      cropCtx.fillRect(0, 0, scaledW, scaledH);
      cropCtx.drawImage(paintCanvas, minX, minY, boxW, boxH, 0, 0, scaledW, scaledH);
      const scaledData = cropCtx.getImageData(0, 0, scaledW, scaledH).data;

      // --- 3. Centre of mass of the scaled bitmap, intensity-weighted.
      let mass = 0, sumX = 0, sumY = 0;
      for (let y = 0; y < scaledH; y++) {
        for (let x = 0; x < scaledW; x++) {
          const i = (y * scaledW + x) * 4;
          const v = (0.299 * scaledData[i] + 0.587 * scaledData[i + 1] + 0.114 * scaledData[i + 2]) / 255;
          mass += v;
          sumX += v * x;
          sumY += v * y;
        }
      }
      const comX = mass > 0 ? sumX / mass : scaledW / 2;
      const comY = mass > 0 ? sumY / mass : scaledH / 2;

      // --- 4. Paste into the 28x28 frame so the centre of mass lands at
      // (14, 14), clamping so the pasted region stays inside the frame.
      const destX = Math.min(Math.max(Math.round(14 - comX), 0), 28 - scaledW);
      const destY = Math.min(Math.max(Math.round(14 - comY), 0), 28 - scaledH);

      hiddenCtx.fillStyle = 'black';
      hiddenCtx.fillRect(0, 0, 28, 28);
      hiddenCtx.drawImage(cropCanvas, destX, destY);

      const data = hiddenCtx.getImageData(0, 0, 28, 28).data;
      let w = 0;
      for (let i = 0; i < data.length; i += 4) {
        const grayscale = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        const value = grayscale / 255.0; // Normalize to [0.0, 1.0]
        // The strokes are white on black, so every channel carries the same
        // value; writing it `channels` times gives the NHWC layout the model wants.
        for (let c = 0; c < channels; c++) inputBuffer[w++] = value;
      }

      return { inputBuffer, ink };
    }

    /* =====================================================================
       PART 3 - THE API UNDER TEST
       navigator.digitclassifier. The whole model - architecture, weights, the
       WGSL that runs it - lives inside the browser, so there is nothing to
       fetch and no backend to choose. Contrast index.html, which downloads a
       ~9 MB wasm runtime and a 1.2 MB .tflite, and webgpu.html, which parses
       that .tflite itself and compiles its own shaders.
       ===================================================================== */

    // Fixed by the IDL: classify() takes exactly 28*28*3 floats in [0,1],
    // NHWC, and rejects anything else with a TypeError.
    const INPUT_CHANNELS = 3;
    const INPUT_LENGTH = 28 * 28 * INPUT_CHANNELS;

    const predictBtn = document.getElementById('predictBtn');
    const apiInfo = document.getElementById('apiInfo');
    const unsupported = document.getElementById('unsupported');

    let model;          // DigitClassifierModel, acquired once
    let getModelMs;     // cost of acquiring it - GPU adapter, device, pipeline
    let coldMs;         // cost of the first classify() after that
    let busy = false;

    function setBusy(value) {
      busy = value;
      predictBtn.disabled = value || !model;
    }

    // Renders a duration, admitting when it fell below the clock's resolution
    // rather than printing a confident "0.00 ms".
    function ms(value) {
      return value > 0 ? `${value.toFixed(2)} ms` : '<1 ms';
    }

    function paintApiInfo() {
      apiInfo.innerHTML =
        `<span class="timing">getModel() ${ms(getModelMs)}</span>` +
        (coldMs === undefined ? '' : `<span class="timing">cold start ${ms(coldMs)}</span>`);
    }

    // Say which of the three requirements is missing, rather than a flat
    // "not supported" - each one has a different fix.
    function explainUnsupported() {
      const reasons = [];
      if (!window.isSecureContext) {
        reasons.push('This page is not a <strong>secure context</strong>. ' +
          'All three interfaces are <code>[SecureContext]</code>, so the API is ' +
          'not exposed over plain <code>http://</code> to a remote host, or from ' +
          '<code>file://</code>. Serve it over <code>https://</code>, or from ' +
          '<code>localhost</code> / <code>127.0.0.1</code>.');
      }
      if (!('digitclassifier' in navigator)) {
        reasons.push('<code>navigator.digitclassifier</code> is missing. It ships only in a ' +
          'Chromium build carrying the <code>DigitClassifier</code> module, and it is ' +
          '<code>status: "test"</code> in <code>runtime_enabled_features.json5</code>, so it ' +
          'stays off unless the browser is started with ' +
          '<code>--enable-blink-features=DigitClassifier</code>.');
      }
      if (!navigator.gpu) {
        reasons.push('<code>navigator.gpu</code> is absent, so there is no WebGPU for the ' +
          'model to run on. The implementation has no CPU path.');
      }
      unsupported.innerHTML =
        '<strong>navigator.digitclassifier is not available here.</strong><ul>' +
        reasons.map(r => `<li>${r}</li>`).join('') + '</ul>';
      unsupported.classList.add('shown');
    }

    // performance.now() is clamped to coarse steps (1 ms in a page that is not
    // cross-origin isolated), and one inference on this small model finishes
    // well inside that. A single run therefore cannot be timed directly - it
    // reads as exactly 0 - so the runs after the first are repeated until the
    // total is measurable and reported as a mean. Same harness as the other two
    // pages, so the figures can be put side by side.
    const TIMING_MIN_MS = 5;
    const TIMING_MAX_RUNS = 50;

    // Times the runs after the first. The first run of a classification still
    // carries a small penalty the later ones do not, so it runs as an untimed
    // warm-up and is left out of the mean.
    async function timedClassify(inputBuffer) {
      let digit = await model.classify(inputBuffer);

      const started = performance.now();
      let runs = 0;
      let elapsed = 0;

      do {
        digit = await model.classify(inputBuffer);
        runs++;
        elapsed = performance.now() - started;
      } while (elapsed < TIMING_MIN_MS && runs < TIMING_MAX_RUNS - 1);

      return { digit, mean: elapsed / runs, runs };
    }

    async function initModel() {
      if (!window.isSecureContext || !('digitclassifier' in navigator) || !navigator.gpu) {
        explainUnsupported();
        apiInfo.textContent = '';
        resultDiv.innerText = 'API unavailable - drawing still works.';
        predictBtn.disabled = true;
        return;
      }

      resultDiv.innerText = 'Acquiring the model...';
      setBusy(true);

      // getModel() waits for exactly two round-trips - RequestAdapter and
      // RequestDevice. It also *orders* the weight uploads, the shader module
      // and the compute pipeline, but those are Dawn wire calls that hand back
      // a client-side handle immediately; nothing here waits for the GPU
      // process to acknowledge them, and the wire is not even flushed. So this
      // figure is the device handshake, not the pipeline build - see the cold
      // start below, which is where the build is actually paid for.
      const started = performance.now();
      model = await navigator.digitclassifier.getModel();
      getModelMs = performance.now() - started;
      paintApiInfo();

      // The first classify() is the first call to flush the wire and submit,
      // so it collects everything getModel() ordered but did not wait for:
      // shader compilation, pipeline creation, buffer allocation. That is why
      // it costs ~40x a steady-state run. Paying it here keeps it off the
      // user's first click. The two figures never overlap - this one is
      // measured after getModel() has already resolved - so they add up to the
      // true time-to-first-answer.
      const coldStarted = performance.now();
      await model.classify(new Float32Array(INPUT_LENGTH));
      coldMs = performance.now() - coldStarted;
      paintApiInfo();

      console.log('digitclassifier startup (ms):', { getModelMs, coldMs });

      resultDiv.innerText = 'Ready.';
      setBusy(false);
    }

    predictBtn.addEventListener('click', async () => {
      if (!model || busy) {
        resultDiv.innerText = 'Model is not ready yet, please wait...';
        return;
      }

      const { inputBuffer, ink } = preprocessCanvas(INPUT_CHANNELS);
      if (ink < 1) {
        resultDiv.innerText = 'Draw a digit first.';
        return;
      }

      setBusy(true);
      resultDiv.innerText = 'Classifying...';

      try {
        const { digit, mean, runs } = await timedClassify(inputBuffer);

        // classify() resolves with the winning digit as a string and nothing
        // else. There is no confidence to report: the shader picks the largest
        // logit on the GPU and returns only its index, so the probabilities the
        // other two pages print are never sent back to JavaScript.
        resultDiv.innerHTML = `Predicted: <strong>${digit}</strong> ` +
          `<span class="confidence">` +
            `<span class="timing">${ms(mean)} per classify()` +
            `${runs > 1 ? ` (mean of ${runs})` : ''}</span>` +
            `<span class="timing">no confidence - the API returns the digit only</span>` +
          `</span>`;
      } catch (err) {
        console.error(err);
        // Worth showing verbatim: a detached buffer, a wrong input length and a
        // lost GPU context all surface here with distinct messages.
        resultDiv.innerHTML = `Inference failed. ` +
          `<span class="confidence">${err.name}: ${err.message}</span>`;
      } finally {
        setBusy(false);
      }
    });

    // Kick off model loading, but never let it break the drawing UI.
    initModel().catch(err => {
      console.error(err);
      resultDiv.innerHTML = 'getModel() failed - drawing still works. ' +
        `<span class="confidence">${err.name}: ${err.message}</span>`;
      predictBtn.disabled = true;
    });
  </script>
</body>
</html>
