<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct WebGPU MNIST Classifier</title>
  <style>
    /* The canvas drives the layout: it shrinks to fit a narrow or a short
       viewport, and the panel is sized from it, so the whole app fits on
       screen without scrolling. --chrome is the vertical space everything
       except the canvas needs; it is measured, not guessed. */
    :root {
      --gap: clamp(6px, 1.6vh, 20px);
      --pad: clamp(10px, 1.8vh, 25px);
      --chrome: 330px;
      --canvas: clamp(140px, min(
                        calc(100vw - 20px - 2 * var(--pad)),
                        calc(100vh - var(--chrome))), 280px);
    }

    @supports (height: 100dvh) {
      /* dvh tracks the collapsing mobile browser toolbar; vh does not. */
      :root {
        --canvas: clamp(140px, min(
                          calc(100vw - 20px - 2 * var(--pad)),
                          calc(100dvh - var(--chrome))), 280px);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      box-sizing: border-box;
    }

    @supports (height: 100dvh) {
      body { min-height: 100dvh; }
    }

    h1 {
      margin: 0 0 4px;
      font-size: clamp(1rem, 4.4vw, 1.8rem);
      text-align: center;
    }

    p {
      color: #aaa;
      margin: 0 0 var(--gap);
      font-size: clamp(0.72rem, 2.9vw, 1rem);
      text-align: center;
      padding: 0 10px;
    }

    /* Height, not width, is the scarce axis on a short window - trim the
       vertical furniture rather than letting vw-based type overflow it. */
    @media (max-height: 700px) {
      h1 { font-size: clamp(0.9rem, 2.6vh, 1.3rem); }
      p { font-size: clamp(0.7rem, 2vh, 0.85rem); }
      #result { min-height: 4.2rem; }
      .backend-info { min-height: 2.1rem; }
    }

    @media (max-height: 560px) {
      p { display: none; }
    }

    .app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #1e1e1e;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);

      /* Sized from the canvas plus its borders and the panel padding, so the
         panel never resizes when the result line grows or shrinks - its width
         depends only on the viewport. */
      box-sizing: border-box;
      width: calc(var(--canvas) + 4px + 2 * var(--pad));
      gap: var(--gap);
      padding: var(--pad);
    }

    /* Visible interactive canvas */
    #paintCanvas {
      display: block;
      width: var(--canvas);
      height: var(--canvas);
      border: 2px solid #333;
      background: #000000;
      cursor: crosshair;
      border-radius: 6px;
      touch-action: none; /* Prevents scrolling while drawing on mobile */
    }

    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    button {
      flex: 1;
      padding: clamp(7px, 1.3vh, 12px);
      border: none;
      border-radius: 6px;
      font-size: clamp(0.8rem, 3.2vw, 1rem);
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    #clearBtn {
      background-color: #333;
      color: #fff;
    }

    #clearBtn:hover {
      background-color: #444;
    }

    #predictBtn {
      background-color: #007acc;
      color: #fff;
    }

    #predictBtn:hover {
      background-color: #0062a3;
    }

    .backend {
      display: flex;
      width: 100%;
      gap: 0;
    }

    .backend button {
      flex: 1;
      border-radius: 0;
      padding: clamp(6px, 1.1vh, 9px);
      font-size: clamp(0.7rem, 2.7vw, 0.85rem);
      background-color: #2a2a2a;
      color: #aaa;
      border: 1px solid #3a3a3a;
    }

    .backend button:first-child { border-radius: 6px 0 0 6px; }
    .backend button:last-child  { border-radius: 0 6px 6px 0; border-left: none; }

    .backend button:hover:not(:disabled):not([aria-pressed="true"]) {
      background-color: #333;
      color: #ddd;
    }

    .backend button[aria-pressed="true"] {
      background-color: #007acc;
      border-color: #007acc;
      color: #fff;
    }

    .backend button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button:disabled {
      opacity: 0.5;
      cursor: progress;
    }

    #result {
      margin-top: 0;
      font-size: clamp(0.95rem, 3.8vw, 1.4rem);
      font-weight: bold;
      text-align: center;

      /* Wrap long status lines instead of widening the panel, and hold enough
         height that the layout does not jump as the text changes length. */
      width: 100%;
      min-height: 5rem;
      overflow-wrap: anywhere;
    }

    .confidence {
      display: block;
      margin-top: 4px;
      font-size: clamp(0.72rem, 2.9vw, 0.95rem);
      color: #aaa;
      font-weight: normal;
      line-height: 1.4;
    }

    /* One measurement per line - they are read individually, not as prose. */
    .timing {
      display: block;
    }

    /* Costs that belong to the active backend rather than to any one
       classification, so they persist instead of being overwritten by a result. */
    .backend-info {
      width: 100%;
      margin-top: calc(var(--gap) * -0.55);
      text-align: center;
      font-size: clamp(0.7rem, 2.7vw, 0.85rem);
      line-height: 1.45;
      color: #888;
      min-height: 2.4rem;
    }

    .alt a { color:#4aa3e0; font-size:0.85rem; }
  </style>
</head>
<body>

  <h1>MNIST — Direct WebGPU</h1>
  <p>Draw a single digit (0-9) clearly in the center of the box</p>

  <div class="app-container">
    <!-- Visual Canvas for Smooth UI Interaction -->
    <canvas id="paintCanvas" width="280" height="280"></canvas>

    <!-- Hidden 28x28 Workspace for preprocessing -->
    <canvas id="mnistCanvas" width="28" height="28" style="display: none;"></canvas>

    <div class="backend" role="group" aria-label="Dispatch mode">
      <button id="fusedBtn" type="button" aria-pressed="false">fused · 1 dispatch</button>
      <button id="layeredBtn" type="button" aria-pressed="false">per-layer · 3 dispatches</button>
    </div>

    <div id="modeInfo" class="backend-info"></div>

    <div class="controls">
      <button id="clearBtn">Clear</button>
      <button id="predictBtn">Classify Digit</button>
    </div>

    <div id="result">Draw and click Classify...</div>
  </div>

  <p class="alt">
    <a href="./index.html">LiteRT.js version →</a> &nbsp;&middot;&nbsp;
    <a href="./browser-model-api.html">navigator.digitclassifier version →</a>
  </p>

  <script type="module">
    /* =====================================================================
       PART 1 - DRAWING
       Deliberately free of imports and top-level awaits: a failure anywhere
       in the model code below must never be able to take the canvas down.
       ===================================================================== */

    const paintCanvas = document.getElementById('paintCanvas');
    const ctx = paintCanvas.getContext('2d', { willReadFrequently: true });
    const resultDiv = document.getElementById('result');

    ctx.strokeStyle = 'white';
    ctx.lineWidth = 18; // Thick enough so it stays legible when downscaled to 28x28
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    let isDrawing = false;

    // Map viewport coordinates onto the canvas bitmap. The scale factor matters
    // whenever CSS sizes the canvas differently from its width/height attributes
    // (responsive layouts, browser zoom, pinch zoom).
    function getCoordinates(e) {
      const rect = paintCanvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (paintCanvas.width / rect.width),
        y: (e.clientY - rect.top) * (paintCanvas.height / rect.height)
      };
    }

    // Start a stroke: capture the pointer and drop a dot so a single tap still
    // leaves ink. One path handles mouse, touch and stylus alike.
    function startDrawing(e) {
      isDrawing = true;
      // Capture keeps the stroke alive when the pointer wanders off the canvas.
      try { paintCanvas.setPointerCapture(e.pointerId); } catch { /* synthetic or stale pointer */ }
      const { x, y } = getCoordinates(e);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y); // A single tap should leave a dot, not nothing
      ctx.stroke();
    }

    // Extend the live stroke to the pointer's latest point, a no-op until a
    // stroke is armed. preventDefault keeps a touch-drag from scrolling the page.
    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault(); // Stop screen bouncing on mobile
      const { x, y } = getCoordinates(e);
      ctx.lineTo(x, y);
      ctx.stroke();
    }

    // Finish the stroke and release the pointer capture, guarded so a stray
    // pointerup with nothing in progress does nothing.
    function stopDrawing(e) {
      if (!isDrawing) return;
      isDrawing = false;
      try { paintCanvas.releasePointerCapture(e.pointerId); } catch { /* already released */ }
    }

    if (window.PointerEvent) {
      // Pointer events cover mouse, touch and stylus in one code path.
      paintCanvas.addEventListener('pointerdown', startDrawing);
      paintCanvas.addEventListener('pointermove', draw);
      paintCanvas.addEventListener('pointerup', stopDrawing);
      paintCanvas.addEventListener('pointercancel', stopDrawing);
    } else {
      paintCanvas.addEventListener('mousedown', startDrawing);
      paintCanvas.addEventListener('mousemove', draw);
      window.addEventListener('mouseup', stopDrawing);
      paintCanvas.addEventListener('touchstart', e => startDrawing(e.touches[0]));
      paintCanvas.addEventListener('touchmove', e => { e.preventDefault(); draw(e.touches[0]); });
      window.addEventListener('touchend', stopDrawing);
    }

    // Clear button: wipe the canvas and the last result so the next digit starts
    // from a blank frame.
    document.getElementById('clearBtn').addEventListener('click', () => {
      ctx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
      resultDiv.innerHTML = 'Canvas cleared.';
    });

    // --- tflite-parser:start ---
    // Minimal TFLite flatbuffer reader. A table at `pos` has its vtable at
    // `pos - i32(pos)`; field n lives at `pos + u16(vtable + 4 + 2n)`, absent when
    // that is 0 or beyond u16(vtable). Vectors and strings are a u32 length
    // followed by data, reached through a u32 offset relative to its own position.
    function parseWeights(bytes) {
      const dv = new DataView(bytes);
      const u8 = (p) => dv.getUint8(p);
      const i8 = (p) => dv.getInt8(p);
      const u16 = (p) => dv.getUint16(p, true);
      const i32 = (p) => dv.getInt32(p, true);
      const u32 = (p) => dv.getUint32(p, true);

      const table = (pos) => ({ pos, vt: pos - i32(pos) });
      const fieldOff = (t, f) => {
        const vtSize = u16(t.vt);
        const idx = 4 + f * 2;
        return idx < vtSize ? u16(t.vt + idx) : 0;
      };
      const scalar = (t, f, read, dflt) => {
        const o = fieldOff(t, f);
        return o ? read(t.pos + o) : dflt;
      };
      const vector = (t, f) => {
        const o = fieldOff(t, f);
        if (!o) return { start: 0, len: 0 };
        let p = t.pos + o;
        p = p + u32(p);
        return { start: p + 4, len: u32(p) };
      };
      const vecTables = (t, f) => {
        const { start, len } = vector(t, f);
        const out = [];
        for (let i = 0; i < len; i++) {
          const p = start + 4 * i;
          out.push(table(p + u32(p)));
        }
        return out;
      };
      const vecI32 = (t, f) => {
        const { start, len } = vector(t, f);
        const out = [];
        for (let i = 0; i < len; i++) out.push(i32(start + 4 * i));
        return out;
      };

      const model = table(u32(0));
      const opcodes = vecTables(model, 1).map((oc) => {
        const builtin = scalar(oc, 3, i32, 0);
        return builtin || scalar(oc, 0, i8, 0);
      });
      const buffers = vecTables(model, 4);
      const sub = vecTables(model, 2)[0];
      const tensors = vecTables(sub, 0);

      const FULLY_CONNECTED = 9;
      const fc = vecTables(sub, 3)
        .filter((op) => opcodes[scalar(op, 0, u32, 0)] === FULLY_CONNECTED);
      if (fc.length !== 2) {
        throw new Error(`expected 2 FULLY_CONNECTED operators, found ${fc.length}`);
      }

      const readTensor = (idx, label) => {
        const t = tensors[idx];
        const type = scalar(t, 1, u8, 0);
        if (type !== 0) throw new Error(`${label}: tensor type ${type}, expected float32 (0)`);
        const { start, len } = vector(buffers[scalar(t, 2, u32, 0)], 0);
        if (!len) throw new Error(`${label}: tensor has no buffer data`);
        // ubyte vector payloads carry no float alignment guarantee - copy first.
        return { shape: vecI32(t, 0), data: new Float32Array(bytes.slice(start, start + len)) };
      };

      const w1 = readTensor(vecI32(fc[0], 1)[1], 'W1');
      const bias1 = readTensor(vecI32(fc[0], 1)[2], 'b1');
      const w2 = readTensor(vecI32(fc[1], 1)[1], 'W2');
      const bias2 = readTensor(vecI32(fc[1], 1)[2], 'b2');

      const expect = (t, want, name) => {
        if (String(t.shape) !== String(want)) {
          throw new Error(`${name}: shape [${t.shape}], expected [${want}]`);
        }
      };
      expect(w1, [128, 2352], 'W1');
      expect(bias1, [128], 'b1');
      expect(w2, [10, 128], 'W2');
      expect(bias2, [10], 'b2');

      return {
        W1: w1.data, b1: bias1.data, W2: w2.data, b2: bias2.data,
        inputSize: 2352, hidden: 128, classes: 10,
      };
    }
    // --- tflite-parser:end ---

    /* =====================================================================
       PART 2 - DIRECT WEBGPU MODEL
       Sibling experiment: index.html runs the same model through LiteRT.js.
       The timing code below is duplicated from it deliberately and MUST stay
       identical, or the two pages' numbers stop being comparable.
       ===================================================================== */

    const fusedBtn = document.getElementById('fusedBtn');
    const layeredBtn = document.getElementById('layeredBtn');
    const predictBtn = document.getElementById('predictBtn');
    const modeInfo = document.getElementById('modeInfo');

    // Nothing that drives the GPU may be clickable until an engine exists.
    // Drawing and Clear stay live regardless - a page that cannot classify is
    // still a page you can draw on.
    // Nothing may re-enter while a run is in flight: the two runs would share one
    // input buffer and one MAP_READ staging buffer. A second Classify submits a
    // copy into a buffer whose mapAsync is still pending, and a mode switch
    // mid-run overwrites the input with its zero-filled cold-start vector -
    // reporting the zero-input answer for whatever was actually drawn.
    let busy = false;

    // Enable or disable the three GPU controls as a group, and set the `busy`
    // re-entrancy flag (see the note above) in one place.
    function setEnabled(on) {
      busy = !on;
      predictBtn.disabled = !on;
      fusedBtn.disabled = !on;
      layeredBtn.disabled = !on;
    }

    setEnabled(false);

    // Downsample the 280x280 drawing to the 28x28 grayscale matrix MNIST expects.
    // Ported verbatim from index.html's preprocessCanvas (only the function
    // name and the returned field differ). The two pages MUST preprocess
    // identically: this page exists to be compared against that one, and if
    // they feed the model different numbers the comparison is meaningless.
    // Keep them in sync by hand - the pages deliberately share no code.
    function preprocess(channels) {
      const hiddenCanvas = document.getElementById('mnistCanvas');
      const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });

      // --- ink check, must run before any bounding-box work: an empty canvas
      // has no bounding box. This reuses the original naive downscale purely to
      // decide whether anything was drawn at all; the real tensor is built below
      // from the centred version once we know there is ink to centre.
      //
      // Paint an opaque black background first. The strokes are anti-aliased, so
      // their edge pixels are partially transparent white; reading them straight
      // out of a transparent canvas yields RGB 255 with a low alpha, which would
      // turn every soft edge into a fully-lit pixel.
      hiddenCtx.globalCompositeOperation = 'source-over';
      hiddenCtx.fillStyle = 'black';
      hiddenCtx.fillRect(0, 0, 28, 28);
      hiddenCtx.drawImage(paintCanvas, 0, 0, paintCanvas.width, paintCanvas.height, 0, 0, 28, 28);

      const naiveData = hiddenCtx.getImageData(0, 0, 28, 28).data;
      let ink = 0;
      for (let i = 0; i < naiveData.length; i += 4) {
        ink += (0.299 * naiveData[i] + 0.587 * naiveData[i + 1] + 0.114 * naiveData[i + 2]) / 255.0;
      }

      const input = new Float32Array(28 * 28 * channels);
      if (ink < 1) return { input, ink };

      // --- 1. Bounding box of the ink on the full-resolution canvas.
      // Composited over black by hand (grayscale * alpha) rather than via a
      // second canvas - this pass only needs the box, not a resampled bitmap.
      // The box is inclusive of both edges, so even a single lit pixel yields a
      // 1x1 (not zero-area) box, which keeps the scale step below from ever
      // dividing by zero.
      const W = paintCanvas.width, H = paintCanvas.height;
      const raw = ctx.getImageData(0, 0, W, H).data;
      const BOX_THRESHOLD = 0.02; // ignore near-invisible anti-aliasing dust
      let minX = W, minY = H, maxX = -1, maxY = -1;
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = (y * W + x) * 4;
          const a = raw[i + 3] / 255;
          const gray = (0.299 * raw[i] + 0.587 * raw[i + 1] + 0.114 * raw[i + 2]) / 255;
          if (gray * a > BOX_THRESHOLD) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      // The ink >= 1 check above should make this unreachable; fall back to a
      // blank frame rather than let an empty box reach the division below.
      if (maxX < minX || maxY < minY) return { input, ink: 0 };

      const boxW = maxX - minX + 1;
      const boxH = maxY - minY + 1;

      // --- 2. Scale that region so its longest side is 20px, preserving aspect.
      const scale = 20 / Math.max(boxW, boxH);
      const scaledW = Math.max(1, Math.round(boxW * scale));
      const scaledH = Math.max(1, Math.round(boxH * scale));

      const cropCanvas = document.createElement('canvas');
      cropCanvas.width = scaledW;
      cropCanvas.height = scaledH;
      const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
      // Same black-fill-before-drawImage reasoning as above: the crop is
      // composited over black so anti-aliased edges read back correctly.
      cropCtx.fillStyle = 'black';
      cropCtx.fillRect(0, 0, scaledW, scaledH);
      cropCtx.drawImage(paintCanvas, minX, minY, boxW, boxH, 0, 0, scaledW, scaledH);
      const scaledData = cropCtx.getImageData(0, 0, scaledW, scaledH).data;

      // --- 3. Centre of mass of the scaled bitmap, intensity-weighted.
      let mass = 0, sumX = 0, sumY = 0;
      for (let y = 0; y < scaledH; y++) {
        for (let x = 0; x < scaledW; x++) {
          const i = (y * scaledW + x) * 4;
          const v = (0.299 * scaledData[i] + 0.587 * scaledData[i + 1] + 0.114 * scaledData[i + 2]) / 255;
          mass += v;
          sumX += v * x;
          sumY += v * y;
        }
      }
      const comX = mass > 0 ? sumX / mass : scaledW / 2;
      const comY = mass > 0 ? sumY / mass : scaledH / 2;

      // --- 4. Paste into the 28x28 frame so the centre of mass lands at
      // (14, 14), clamping so the pasted region stays inside the frame.
      const destX = Math.min(Math.max(Math.round(14 - comX), 0), 28 - scaledW);
      const destY = Math.min(Math.max(Math.round(14 - comY), 0), 28 - scaledH);

      hiddenCtx.fillStyle = 'black';
      hiddenCtx.fillRect(0, 0, 28, 28);
      hiddenCtx.drawImage(cropCanvas, destX, destY);

      const data = hiddenCtx.getImageData(0, 0, 28, 28).data;
      let w = 0;
      for (let i = 0; i < data.length; i += 4) {
        const grayscale = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        const value = grayscale / 255.0; // Normalize to [0.0, 1.0]
        // The strokes are white on black, so every channel carries the same
        // value; writing it `channels` times gives the NHWC layout the model wants.
        for (let c = 0; c < channels; c++) input[w++] = value;
      }

      return { input, ink };
    }

    const FUSED_WGSL = `
@group(0) @binding(0) var<storage, read>       input  : array<f32>;
@group(0) @binding(1) var<storage, read>       w1     : array<f32>;
@group(0) @binding(2) var<storage, read>       bias1  : array<f32>;
@group(0) @binding(3) var<storage, read>       w2     : array<f32>;
@group(0) @binding(4) var<storage, read>       bias2  : array<f32>;
@group(0) @binding(5) var<storage, read_write> result : array<f32>;

var<workgroup> hidden : array<f32, 128>;
var<workgroup> logits : array<f32, 10>;

@compute @workgroup_size(128)
fn main(@builtin(local_invocation_id) lid : vec3<u32>) {
  let t = lid.x;

  var acc = bias1[t];
  // w1 is stored transposed, [2352][128]: consecutive lanes read consecutive
  // floats, so each step is one coalesced burst rather than 128 scattered reads.
  for (var i = 0u; i < 2352u; i = i + 1u) {
    acc = acc + w1[i * 128u + t] * input[i];
  }
  hidden[t] = max(acc, 0.0);

  workgroupBarrier();

  if (t < 10u) {
    var acc2 = bias2[t];
    let base2 = t * 128u;
    for (var i = 0u; i < 128u; i = i + 1u) {
      acc2 = acc2 + w2[base2 + i] * hidden[i];
    }
    logits[t] = acc2;
  }

  workgroupBarrier();

  if (t == 0u) {
    var m = logits[0];
    for (var i = 1u; i < 10u; i = i + 1u) { m = max(m, logits[i]); }
    var s = 0.0;
    for (var i = 0u; i < 10u; i = i + 1u) { s = s + exp(logits[i] - m); }
    for (var i = 0u; i < 10u; i = i + 1u) { result[i] = exp(logits[i] - m) / s; }
  }
}`;

    const LAYER1_WGSL = `
@group(0) @binding(0) var<storage, read>       input  : array<f32>;
@group(0) @binding(1) var<storage, read>       w1     : array<f32>;
@group(0) @binding(2) var<storage, read>       bias1  : array<f32>;
@group(0) @binding(3) var<storage, read_write> hidden : array<f32>;

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid : vec3<u32>) {
  let o = gid.x;
  if (o >= 128u) { return; }
  var acc = bias1[o];
  // Same transposed w1 as the fused path - the variable under test between the
  // two modes is dispatch count, so their memory layout has to match.
  for (var i = 0u; i < 2352u; i = i + 1u) {
    acc = acc + w1[i * 128u + o] * input[i];
  }
  hidden[o] = max(acc, 0.0);
}`;

    const LAYER2_WGSL = `
@group(0) @binding(0) var<storage, read>       hidden : array<f32>;
@group(0) @binding(1) var<storage, read>       w2     : array<f32>;
@group(0) @binding(2) var<storage, read>       bias2  : array<f32>;
@group(0) @binding(3) var<storage, read_write> logits : array<f32>;

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid : vec3<u32>) {
  let o = gid.x;
  if (o >= 10u) { return; }
  var acc = bias2[o];
  let base = o * 128u;
  for (var i = 0u; i < 128u; i = i + 1u) {
    acc = acc + w2[base + i] * hidden[i];
  }
  logits[o] = acc;
}`;

    const SOFTMAX_WGSL = `
@group(0) @binding(0) var<storage, read>       logits : array<f32>;
@group(0) @binding(1) var<storage, read_write> result : array<f32>;

@compute @workgroup_size(1)
fn main() {
  var m = logits[0];
  for (var i = 1u; i < 10u; i = i + 1u) { m = max(m, logits[i]); }
  var s = 0.0;
  for (var i = 0u; i < 10u; i = i + 1u) { s = s + exp(logits[i] - m); }
  for (var i = 0u; i < 10u; i = i + 1u) { result[i] = exp(logits[i] - m) / s; }
}`;

    // A shader that fails to compile otherwise surfaces as a wrong-looking
    // result rather than an error, so pull the compilation messages out and
    // fail loudly with them.
    async function checkShaders(device) {
      const sources = {
        FUSED_WGSL, LAYER1_WGSL, LAYER2_WGSL, SOFTMAX_WGSL,
      };
      for (const [name, code] of Object.entries(sources)) {
        const info = await device.createShaderModule({ code }).getCompilationInfo();
        for (const m of info.messages) {
          console[m.type === 'error' ? 'error' : 'warn'](
            `${name}:${m.lineNum}:${m.linePos} ${m.type}: ${m.message}`);
        }
        if (info.messages.some((m) => m.type === 'error')) {
          throw new Error(`${name} failed to compile - see the console.`);
        }
      }
    }

    // Acquire a WebGPU device, or throw a specific reason (no WebGPU, no adapter)
    // that initEngine can surface to the user.
    async function getDevice() {
      if (!navigator.gpu) throw new Error('This browser does not support WebGPU.');
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) throw new Error('No WebGPU adapter available in this browser.');
      return adapter.requestDevice();
    }

    // Build everything the GPU needs and hand back a small engine object. Called
    // once: it uploads the four weight tensors into their own storage buffers and
    // allocates the reused input / result / readback buffers, then exposes run()
    // plus a fused <-> per-layer mode switch. The weights never move again; each
    // inference only rewrites the input buffer and reads 10 floats back.
    //   - fused:     one dispatchWorkgroups(1) at workgroup_size 128, the hidden
    //                layer kept in var<workgroup> - the whole model in one shader.
    //   - per-layer: three dispatches through storage buffers, the way a general
    //                runtime must work; the gap between the two is the dispatch-cost
    //                measurement this page exists to make.
    function createEngine(device, weights) {
      const S = GPUBufferUsage.STORAGE;
      // mk uploads a Float32Array into a fresh buffer at creation; empty allocates
      // an uninitialised buffer. Both run once here, off the timed path.
      const mk = (data, usage) => {
        const b = device.createBuffer({ size: data.byteLength, usage, mappedAtCreation: true });
        new Float32Array(b.getMappedRange()).set(data);
        b.unmap();
        return b;
      };
      const empty = (bytes, usage) => device.createBuffer({ size: bytes, usage });

      // W1 arrives from the .tflite as [128][2352] - output-major, so the fused
      // kernel's inner loop indexed w1[t*2352 + i] and the 128 lanes read
      // addresses 9408 bytes apart: no coalescing. Transposing to [2352][128]
      // makes lane t read w1T[i*128 + t] - 128 consecutive floats, one coalesced
      // burst per step. The arithmetic and its order are untouched, so results
      // stay bit-identical; only the addressing changes. Done once at upload.
      //
      // Measured, this buys nothing: at batch-1 the weight read is off the
      // critical path - the CPU<->GPU round-trip dominates - so fused stayed at
      // ~3.26 ms with or without it (docs/measurements/2026-08-24-coalesce-w1-ab.md).
      // Kept anyway: it is the layout a larger model would need, and it costs
      // nothing at run time.
      const transpose = (src, rows, cols) => {
        const dst = new Float32Array(src.length);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) dst[c * rows + r] = src[r * cols + c];
        }
        return dst;
      };

      const buf = {
        input:  empty(2352 * 4, S | GPUBufferUsage.COPY_DST),
        w1:     mk(transpose(weights.W1, 128, 2352), S),
        b1:     mk(weights.b1, S),
        w2:     mk(weights.W2, S),
        b2:     mk(weights.b2, S),
        result: empty(10 * 4, S | GPUBufferUsage.COPY_SRC),
        read:   empty(10 * 4, GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST),
        hidden: empty(128 * 4, S),
        logits: empty(10 * 4, S),
      };

      const built = {};
      let mode = 'fused';

      // Compile the single fused shader and bind all six buffers to it: one pass,
      // one workgroup, the whole inference in one dispatch.
      function buildFused() {
        const pipeline = device.createComputePipeline({
          layout: 'auto',
          compute: { module: device.createShaderModule({ code: FUSED_WGSL }), entryPoint: 'main' },
        });
        const bind = device.createBindGroup({
          layout: pipeline.getBindGroupLayout(0),
          entries: [buf.input, buf.w1, buf.b1, buf.w2, buf.b2, buf.result]
            .map((b, i) => ({ binding: i, resource: { buffer: b } })),
        });
        return { passes: [{ pipeline, bind, groups: 1 }] };
      }

      // Compile the three per-layer shaders (dense -> dense -> softmax), each its
      // own dispatch through storage buffers. stage() compiles and binds one.
      function buildLayered() {
        const stage = (code, buffers, groups) => {
          const pipeline = device.createComputePipeline({
            layout: 'auto',
            compute: { module: device.createShaderModule({ code }), entryPoint: 'main' },
          });
          const bind = device.createBindGroup({
            layout: pipeline.getBindGroupLayout(0),
            entries: buffers.map((b, i) => ({ binding: i, resource: { buffer: b } })),
          });
          return { pipeline, bind, groups };
        };
        // Three dispatches recorded into one compute pass: WebGPU orders them and
        // makes each dispatch's writes visible to the next, so no explicit barrier.
        return {
          passes: [
            stage(LAYER1_WGSL,  [buf.input, buf.w1, buf.b1, buf.hidden], 2),
            stage(LAYER2_WGSL,  [buf.hidden, buf.w2, buf.b2, buf.logits], 1),
            stage(SOFTMAX_WGSL, [buf.logits, buf.result], 1),
          ],
        };
      }

      // Select fused or per-layer, compiling that mode's pipelines on first use
      // and caching them so a later switch back is instant.
      function setMode(next) {
        mode = next;
        if (!built[next]) built[next] = next === 'fused' ? buildFused() : buildLayered();
      }

      // One inference: upload the input, record the mode's dispatch(es) into a
      // compute pass, copy the 10 result floats into the MAP_READ buffer, submit,
      // then block on mapAsync until the GPU answers. That await is the CPU<->GPU
      // round-trip that dominates this page's time (see the README's trace).
      async function run(input) {
        device.queue.writeBuffer(buf.input, 0, input);
        const enc = device.createCommandEncoder();
        const pass = enc.beginComputePass();
        for (const p of built[mode].passes) {
          pass.setPipeline(p.pipeline);
          pass.setBindGroup(0, p.bind);
          pass.dispatchWorkgroups(p.groups);
        }
        pass.end();
        enc.copyBufferToBuffer(buf.result, 0, buf.read, 0, 40);
        device.queue.submit([enc.finish()]);
        await buf.read.mapAsync(GPUMapMode.READ);
        const out = new Float32Array(buf.read.getMappedRange().slice(0));
        buf.read.unmap();
        return out;
      }

      setMode('fused');
      return { setMode, run, get mode() { return mode; } };
    }

    let engine;
    let pipelineMs;   // cost of building this mode's pipelines
    let coldMs;       // cost of the first inference after building them

    // Timing copied verbatim from index.html and it MUST stay identical - this
    // page exists to be compared against that one, and a timing method that
    // differs even slightly makes the comparison meaningless.
    // performance.now() is clamped to coarse steps (1 ms in a page that is not
    // cross-origin isolated) and one inference finishes well inside that, so a
    // single run cannot be timed directly. Repeat, and report the mean.
    // A fixed count, not a time budget. Under a budget the number of runs was
    // whatever the budget bought, so the 0.15 ms CPU path averaged ~33 runs and
    // a 3 ms GPU path only 1-3: the two were not sampled alike, and their
    // spreads were therefore not comparable quantities. A fixed count samples
    // every path identically, and lets the loop read the clock twice instead of
    // once per iteration. 100 is the compromise - it holds the slowest path to
    // ~0.3 s per click while still giving the CPU ~15 ms of elapsed time, which
    // the 1 ms clock can resolve to about 7%.
    // Overridable from the URL so a run can be re-sampled without editing the
    // page: ?timing_runs=400.
    const TIMING_PARAMS = new URLSearchParams(location.search);
    const timingParam = (name, fallback) => {
      const v = Number(TIMING_PARAMS.get(name));
      return Number.isFinite(v) && v > 0 ? v : fallback;
    };
    const TIMING_RUNS = timingParam('timing_runs', 100);

    // Renders a duration, admitting when it fell below the clock's resolution
    // rather than printing a confident "0.00 ms".
    function ms(value) {
      return value > 0 ? `${value.toFixed(2)} ms` : '<1 ms';
    }

    // Times the runs after the first. The first run of a classification carries
    // a small penalty the later ones do not, so it runs as an untimed warm-up
    // and is left out of the mean. The genuinely cold first inference is timed
    // once per pipeline build instead, and reported as "cold start".
    async function timedInfer(input) {
      let values = await engine.run(input);

      const started = performance.now();
      for (let i = 0; i < TIMING_RUNS; i++) {
        values = await engine.run(input);
      }
      const elapsed = performance.now() - started;

      return { values, mean: elapsed / TIMING_RUNS, runs: TIMING_RUNS };
    }

    // These two costs belong to the active dispatch mode, not to any one
    // classification, so they render into their own line and persist while
    // results come and go.
    function paintModeInfo() {
      modeInfo.innerHTML =
        `<span class="timing">pipeline ${ms(pipelineMs)}</span>` +
        `<span class="timing">cold start ${ms(coldMs)}</span>`;
    }

    // Build a mode's pipelines and time both that build and its first inference.
    async function useMode(next) {
      const pipelineStarted = performance.now();
      engine.setMode(next);
      pipelineMs = performance.now() - pipelineStarted;

      const coldStarted = performance.now();
      await engine.run(new Float32Array(28 * 28 * 3));
      coldMs = performance.now() - coldStarted;

      paintModeInfo();
      paintToggle();
    }

    // Reflect the engine's current dispatch mode on the two toggle buttons.
    function paintToggle() {
      fusedBtn.setAttribute('aria-pressed', String(engine && engine.mode === 'fused'));
      layeredBtn.setAttribute('aria-pressed', String(engine && engine.mode === 'layered'));
    }

    async function switchMode(next) {
      if (!engine || busy) return;
      // Guard the rebuild, not the UI sync: engine.mode can already equal `next`
      // (e.g. set directly through the engine API rather than via this button),
      // and the toggle must still reflect the engine's actual current mode.
      if (engine.mode !== next) {
        setEnabled(false);
        resultDiv.innerText = `Switching to ${next}...`;
        modeInfo.innerHTML = '<span class="timing">building...</span>';
        try {
          await useMode(next);
          resultDiv.innerText = `Ready on ${next}.`;
        } catch (err) {
          console.error(err);
          resultDiv.innerText = 'Switching failed. Check the console.';
          modeInfo.textContent = '';
        } finally {
          setEnabled(true);
        }
      }
      paintToggle();
    }

    fusedBtn.addEventListener('click', () => switchMode('fused'));
    layeredBtn.addEventListener('click', () => switchMode('layered'));

    // One-time startup: fetch and parse the .tflite for its weights, acquire a GPU
    // device (wiring device-lost to a message), verify every shader compiles, then
    // build the engine and warm the fused mode. Weights and device are acquired
    // once here; classification afterwards touches neither. Anything that throws
    // leaves the drawing UI alive - see the catch on the initEngine() call below.
    async function initEngine() {
      resultDiv.innerText = 'Loading weights...';
      const res = await fetch('./digit_classifier.tflite');
      if (!res.ok) throw new Error(`Could not fetch the model: ${res.status}`);
      const weights = parseWeights(await res.arrayBuffer());
      const device = await getDevice();
      device.lost.then((info) => {
        console.error('WebGPU device lost:', info);
        resultDiv.innerText = 'GPU device lost. Reload the page.';
      });
      await checkShaders(device);
      engine = createEngine(device, weights);
      window.__engine = engine;              // test hook
      await useMode('fused');
      resultDiv.innerText = 'Ready on fused.';
      setEnabled(true);
    }

    // Classify what is drawn: preprocess to 2352 floats, run the timed inference
    // on the active mode, and render the argmax digit with confidence and mean
    // latency. Guards an empty canvas and a not-yet-ready engine.
    predictBtn.addEventListener('click', async () => {
      if (busy) return;
      if (!engine) {
        resultDiv.innerText = 'Engine is not ready yet.';
        return;
      }

      const { input, ink } = preprocess(3);
      if (ink < 1) {
        resultDiv.innerText = 'Draw a digit first.';
        return;
      }

      const ranOn = engine.mode;
      setEnabled(false);
      resultDiv.innerText = 'Classifying...';

      try {
        const { values, mean, runs } = await timedInfer(input);
        const probs = Array.from(values);
        const digit = probs.indexOf(Math.max(...probs));

        resultDiv.innerHTML = `Predicted: <strong>${digit}</strong> ` +
          `<span class="confidence">` +
            `<span class="timing">(${(probs[digit] * 100).toFixed(1)}% match)</span>` +
            `<span class="timing">${ms(mean)} on ${ranOn}` +
            `${runs > 1 ? ` (mean of ${runs})` : ''}</span>` +
          `</span>`;
      } catch (err) {
        console.error(err);
        resultDiv.innerText = 'Inference failed. Check the console.';
      } finally {
        setEnabled(true);
      }
    });

    initEngine().catch((err) => {
      console.error(err);
      setEnabled(false);
      modeInfo.textContent = '';
      resultDiv.innerText = `${err.message} Drawing still works.`;
    });
  </script>
</body>
